[package]
name = "satchel-providers"
description = "IMAP/SMTP, Gmail, Microsoft Graph, JMAP, CalDAV and Google Calendar adapters"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
satchel-api.workspace = true
satchel-core.workspace = true
satchel-mime.workspace = true
satchel-ical.workspace = true
anyhow.workspace = true
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
futures.workspace = true
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-native-certs", "aws-lc-rs"] }
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "form", "query", "charset", "http2", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-native-certs = "0.8.5"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws-lc-rs"] }
tracing.workspace = true
url = "2"

# Apple Maps place suggestions in the Mac app (0050).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSError", "NSObject", "NSString"] }
objc2-map-kit = { version = "0.3.2", default-features = false, features = ["std", "MKLocalSearchCompleter"] }
