[package]
name = "satchel-desktop"
description = "satchel.email desktop app (Tauri)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "satchel-mail"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
satchel-api.workspace = true
satchel-core.workspace = true
satchel-providers.workspace = true
satchel-mime.workspace = true
anyhow.workspace = true
chrono.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-notification = "2.7.0"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-updater = { version = "2.14.0", optional = true }

# setxattr, to set the quarantine attribute on saved attachments.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"
# Which app notifications are posted as (see `main`).
mac-notification-sys = "0.6.15"
# Calendar alerts as scheduled system notifications with actions (0057).
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSArray", "NSDate", "NSDictionary", "NSError", "NSObject", "NSSet", "NSString", "NSBundle"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "bitflags", "block2", "UNNotification", "UNNotificationAction", "UNNotificationCategory", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }

[features]
# Passed by `tauri build`; enables production asset embedding.
custom-protocol = ["tauri/custom-protocol"]
# Release builds with an update feed (see scripts/release.sh).
updater = ["dep:tauri-plugin-updater"]
